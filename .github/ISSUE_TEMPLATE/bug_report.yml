name: Bug Report
description: Report a broken activation file, MCP config, or incorrect behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.
        **Do not include API keys or tokens in any field.**

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which AI provider are you using?
      options:
        - GitHub Copilot (VS Code)
        - Cursor
        - Windsurf
        - Claude (claude.ai)
        - Claude Desktop
        - Gemini (AI Studio)
        - OpenAI (ChatGPT)
        - OpenRouter
        - Kimi (Moonshot)
        - Mistral (Le Chat)
        - OpenClaw
        - Generic / API / Framework
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Version
      description: Which version of DevWeaver-Lite are you using?
      options:
        - "0.1.0-beta.1 (latest)"
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong? What did you expect to happen?
      placeholder: "e.g. The CONFIRM gate does not fire before file deletion"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Copy copilot-instructions.md to .github/
        2. Ask agent to delete a file
        3. Agent deletes without asking for confirmation
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Paste any relevant error messages, MCP logs, or config snippets (no secrets)
